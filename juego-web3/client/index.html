<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Luz y Sombra</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="game"></div>
    <form id="login" class="panel hidden" autocomplete="on">
      <h1>Luz y Sombra</h1>
      <p class="sub" id="sub"></p>
      <label for="usuario">Usuario
        <input id="usuario" name="username" autocomplete="username" maxlength="20" required />
      </label>
      <label for="clave">Contraseña
        <input id="clave" name="password" type="password" autocomplete="current-password" maxlength="72" required />
      </label>
      <div class="row">
        <button type="submit" id="b-login"></button>
        <button type="button" id="b-register" class="secondary"></button>
      </div>
      <p class="err" id="err" role="alert"></p>
      <p class="help" id="help"></p>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
